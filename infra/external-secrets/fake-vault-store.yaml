apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake-vault
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-backend
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: secret-backend 
      auth:
        serviceAccount:
          name: eso-reader
          namespace: secret-backend
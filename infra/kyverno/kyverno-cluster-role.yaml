apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:create-externalsecrets
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: 'true'
rules:
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
      - externalsecrets/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-namespace-labels-test
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: require-namespace-labels
    isValidatingPolicy: true
    kind: Namespace
    resources:
      - good-namespace
    result: pass
  - policy: require-namespace-labels
    isValidatingPolicy: true
    kind: Namespace
    resources:
      - bad-namespace-no-labels
      - bad-namespace-empty-label
      - bad-namespace-missing-environment
    result: fail

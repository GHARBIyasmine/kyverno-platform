apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-namespace-labels
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  validations:
    - message: "Namespaces must define non-empty 'team' and 'environment' labels."
      expression: >
        object.metadata.?labels.team.orValue('') != '' &&
        object.metadata.?labels.environment.orValue('') != ''

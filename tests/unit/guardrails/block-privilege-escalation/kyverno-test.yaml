apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: block-privilege-escalation-test
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: block-privilege-escalation
    isValidatingPolicy: true
    kind: Pod
    resources:
      - good-pod
    result: pass
  - policy: block-privilege-escalation
    isValidatingPolicy: true
    kind: Pod
    resources:
      - bad-pod-no-securitycontext
      - bad-pod-escalation-true
    result: fail

apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: block-hostpath-volumes-test
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: block-hostpath-volumes
    isValidatingPolicy: true
    kind: Pod
    resources:
      - good-pod-no-volumes
      - good-pod-emptydir
    result: pass
  - policy: block-hostpath-volumes
    isValidatingPolicy: true
    kind: Pod
    resources:
      - bad-pod-hostpath
    result: fail


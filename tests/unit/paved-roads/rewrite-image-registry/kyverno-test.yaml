apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rewrite-image-registry-test
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: rewrite-image-registry
    isMutatingPolicy: true
    kind: Pod
    resources:
      - already-internal-pod
    patchedResources: patched-already-internal-pod.yaml
    result: pass
  - policy: rewrite-image-registry
    isMutatingPolicy: true
    kind: Pod
    resources:
      - external-image-pod
    patchedResources: patched-external-image-pod.yaml
    result: pass
  - policy: rewrite-image-registry
    isMutatingPolicy: true
    kind: Pod
    resources:
      - multi-container-mixed-pod
    patchedResources: patched-multi-container-mixed-pod.yaml
    result: pass

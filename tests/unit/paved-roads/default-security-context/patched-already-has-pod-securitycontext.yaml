apiVersion: v1
kind: Pod
metadata:
  name: already-has-pod-securitycontext
spec:
  securityContext:
    runAsNonRoot: false
  containers:
    - name: app
      image: ghcr.io/gharbiyasmine/kyverno-demo-unsigned:1.0.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true

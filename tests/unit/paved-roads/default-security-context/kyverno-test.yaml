apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: default-security-context-test
policies:
  - policy.yaml
resources:
  - resources.yaml
results:
  - policy: default-security-context
    isMutatingPolicy: true
    kind: Pod
    resources:
      - no-securitycontext-pod
    patchedResources: patched-no-securitycontext-pod.yaml
    result: pass
  - policy: default-security-context
    isMutatingPolicy: true
    kind: Pod
    resources:
      - already-has-pod-securitycontext
    patchedResources: patched-already-has-pod-securitycontext.yaml
    result: pass
  - policy: default-security-context
    isMutatingPolicy: true
    kind: Pod
    resources:
      - already-has-container-securitycontext
    patchedResources: patched-already-has-container-securitycontext.yaml
    result: pass

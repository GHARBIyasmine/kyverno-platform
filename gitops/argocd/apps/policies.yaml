apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  source:
    repoURL: https://github.com/GHARBIyasmine/kyverno-platform.git
    targetRevision: main
    path: policies
    directory:
      recursive: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
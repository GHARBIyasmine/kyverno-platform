apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Kyverno policy platform + supporting infra (ESO, policies)

  sourceRepos:
    - https://github.com/GHARBIyasmine/kyverno-platform.git
    - https://kyverno.github.io/kyverno/        # kyverno helm repo
    - https://charts.external-secrets.io          # eso helm repo

  destinations:
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: '*'          # policies/generate targets can land in various namespaces

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: policies.kyverno.io
      kind: '*'
    - group: kyverno.io
      kind: '*'
    - group: admissionregistration.k8s.io
      kind: '*'
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: external-secrets.io
      kind: ClusterSecretStore

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
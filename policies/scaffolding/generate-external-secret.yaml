apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: generate-external-secret
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
  # secret-backend is excluded for the same reason as the others, plus
  # one more: it's the source of truth ESO reads from, not a consumer so
  # it should never get an ExternalSecret pointed at itself.
  matchConditions:
    - name: exclude-infra-namespaces
      expression: >
        !(object.metadata.name in [
          "kube-system", "kube-public", "kube-node-lease", "default",
          "kyverno", "argocd", "external-secrets", "secret-backend"
        ])
  variables:
    - name: nsName
      expression: "object.metadata.name"
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: default-external-secret
            namespace: (( variables.nsName ))
          spec:
            refreshInterval: 1h
            secretStoreRef:
              name: fake-vault
              kind: ClusterSecretStore
            target:
              name: synced-db-credentials
              creationPolicy: Owner
            data:
              - secretKey: username
                remoteRef:
                  key: demo-db-credentials
                  property: username
              - secretKey: password
                remoteRef:
                  key: demo-db-credentials
                  property: password

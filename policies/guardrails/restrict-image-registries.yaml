apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - message: >-
        Images must come from an approved registry (ghcr.io/gharbiyasmine).
      expression: >
        object.spec.containers.all(c, c.image.startsWith('ghcr.io/gharbiyasmine/')
        ) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.startsWith('ghcr.io/gharbiyasmine/')
        )) &&
        (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c, c.image.startsWith('ghcr.io/gharbiyasmine/')
        ))
